name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate lighting cache key
        id: lighting
        run: |
          node --import tsx --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { lightingRevision } from './scripts/lighting-plugin.ts';
          const { revision } = await lightingRevision(process.cwd(), 'full');
          console.log(`revision=${revision}`);
          JS

      - name: Cache production lighting
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/samewhere-lighting
          key: ${{ runner.os }}-lighting-${{ steps.lighting.outputs.revision }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build game
        run: npm run build

      - name: Include copyright notice
        run: cp COPYRIGHT dist/COPYRIGHT

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
